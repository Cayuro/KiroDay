[project]
name = "pos-backend"
version = "0.1.0"
description = "POS MVP backend — FastAPI + DynamoDB single-table"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "mangum>=0.17.0",
    "boto3>=1.34.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "hypothesis>=6.100.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
